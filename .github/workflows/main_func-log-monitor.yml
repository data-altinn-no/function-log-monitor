# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - func-log-monitor

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '10.0.x' # set this to the dotnet version to use

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Gate the deploy on tests. Redactor.cs is the boundary between production
      # PII and a GitHub issue, and Fingerprint.cs decides whether an issue is
      # filed at all; neither should reach prod unverified.
      - name: 'Test'
        shell: bash
        run: dotnet test --configuration Release --nologo --verbosity minimal

      - name: 'Resolve Project Dependencies Using Dotnet'
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          # Build the Function project explicitly: a bare `dotnet build` here
          # would pick up the solution and publish the test project into the
          # deployment output too.
          dotnet build FunctionLogMonitor.csproj --configuration Release --output ./output
          popd
      
      - name: Login to Azure
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_460A2E0B242F49489D6487742B3DC366 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EDFECEEB70144446B983F88409364B61 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_147FA8267061429E864079179C0EAFF8 }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@4c708484940839593f2d74df7d2767df709ac3c2 # v1.5.2
        id: fa
        with:
          app-name: 'func-log-monitor'
          slot-name: 'Production'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'
          